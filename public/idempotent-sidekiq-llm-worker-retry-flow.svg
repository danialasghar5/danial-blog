<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 716" role="img"
  aria-label="Idempotent Sidekiq worker flow for LLM calls in Rails showing retry handling and completion gate.">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6E6E67"/>
    </marker>
    <marker id="arwA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6FB39A"/>
    </marker>
    <style>
      .box{fill:#161714;stroke:#2E332C;stroke-width:1.5;rx:10;}
      .lbl{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#ECECE6;font-size:15px;font-weight:600;}
      .sub{font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;fill:#A6A69E;font-size:12.5px;font-weight:400;}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:#A6A69E;font-size:12px;}
      .flow{stroke:#6E6E67;stroke-width:1.6;fill:none;}
      .accent{stroke:#6FB39A;fill:none;}
      .badge{font-family:ui-sans-serif,system-ui,sans-serif;fill:#0E0F0D;font-size:10px;font-weight:700;letter-spacing:.04em;}
    </style>
  </defs>

  <rect width="760" height="716" fill="#0E0F0D"/>
  <text x="32" y="34" class="lbl" font-size="13" fill="#6FB39A" letter-spacing=".08em">TRIAGE WORKER · RETRY FLOW</text>

  <!-- Request path -->
  <rect class="box" x="230" y="52" width="300" height="46" rx="10"/>
  <text x="380" y="80" text-anchor="middle" class="lbl">POST /tickets</text>
  <path class="flow" d="M380 98 V122" marker-end="url(#arw)"/>

  <rect class="box" x="210" y="124" width="340" height="50" rx="10"/>
  <text x="380" y="147" text-anchor="middle" class="lbl">Persist ticket · PostgreSQL</text>
  <text x="380" y="164" text-anchor="middle" class="mono">UUID id (generated before enqueue)</text>
  <path class="flow" d="M380 174 V198" marker-end="url(#arw)"/>

  <rect class="box" x="230" y="200" width="300" height="46" rx="10"/>
  <text x="380" y="228" text-anchor="middle" class="lbl">Sidekiq enqueue → 202 Accepted</text>
  <path class="flow" d="M380 246 V276" marker-end="url(#arw)"/>

  <!-- Worker boundary -->
  <rect x="120" y="276" width="520" height="372" rx="14" fill="#111512" stroke="#2E332C" stroke-width="1.5"/>
  <text x="140" y="302" class="sub" font-weight="600" fill="#ECECE6">TriageWorker · Sidekiq (retry: 3 → Dead Set)</text>

  <!-- Completion gate (SHIPPED, accent) -->
  <rect x="176" y="320" width="408" height="58" rx="10" fill="#182420" stroke="#6FB39A" stroke-width="1.6"/>
  <rect x="500" y="330" width="72" height="20" rx="10" fill="#6FB39A"/>
  <text x="536" y="344" text-anchor="middle" class="badge">SHIPPED</text>
  <text x="196" y="345" class="lbl" font-size="14">Completion-state gate</text>
  <text x="196" y="366" class="mono" fill="#8FBFAD">return if ticket.completed?  → retry is a no-op</text>
  <path class="flow" d="M380 378 V404" marker-end="url(#arw)"/>

  <rect class="box" x="210" y="406" width="340" height="44" rx="10"/>
  <text x="380" y="433" text-anchor="middle" class="lbl">OpenAI call · Structured Outputs</text>
  <path class="flow" d="M380 450 V474" marker-end="url(#arw)"/>

  <rect class="box" x="210" y="476" width="340" height="44" rx="10"/>
  <text x="380" y="503" text-anchor="middle" class="lbl">Validate response</text>
  <path class="flow" d="M380 520 V544" marker-end="url(#arw)"/>

  <rect class="box" x="210" y="546" width="340" height="46" rx="10"/>
  <text x="380" y="574" text-anchor="middle" class="lbl">Persist result → completed</text>

  <!-- Retry path back to the gate (accent) -->
  <path class="flow accent" stroke-dasharray="0" d="M550 569 H602 V349 H586" marker-end="url(#arwA)"/>
  <text x="612" y="462" class="sub" fill="#6FB39A" transform="rotate(90 612 462)">retry / crash before write</text>

  <!-- Future hardening (dashed, muted) -->
  <rect x="120" y="668" width="520" height="34" rx="9" fill="none" stroke="#4A4E45" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="380" y="690" text-anchor="middle" class="mono" fill="#71716A">FUTURE — atomic claim: pending → processing (not shipped)</text>
  <path class="flow" stroke="#4A4E45" stroke-dasharray="5 4" d="M380 648 V666" marker-end="url(#arw)"/>
</svg>
